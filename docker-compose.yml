services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-mvp-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:-http://localhost:9000}
      PRODUCTS_IMAGE_DIR: ${PRODUCTS_IMAGE_DIR}
      RESTAURANT_IMAGE_DIR: ${RESTAURANT_IMAGE_DIR}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos-mvp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      CI: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_APP_BASE_URL: ${VITE_APP_BASE_URL}
      VITE_API_PREFIX: ${VITE_API_PREFIX}
      VITE_AUTH_STORAGE_KEY: ${VITE_AUTH_STORAGE_KEY}
      VITE_ORDER_POLLING_INTERVAL_MS: ${VITE_ORDER_POLLING_INTERVAL_MS}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Keep the named node_modules volume synchronized when dependencies change.
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"

volumes:
  frontend_node_modules:
